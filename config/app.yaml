app:
  timezone: Asia/Seoul
  database_path: data/tradebot.sqlite
  reports_path: reports
  logs_path: logs

api:
  provider: tossinvest
  base_url: https://openapi.tossinvest.com
  token_url: /oauth2/token
  timeout_seconds: 5
  retry_count: 2
  retry_backoff_seconds: 1
  # 토큰은 client당 1개만 유효(재발급 시 이전 토큰 무효화)하므로 캐시 후 만료 임박 시에만 재발급.
  token_refresh_margin_seconds: 300
  # 클라이언트 측 초당 요청 제한 (Rate Limits Group 별). 실제 한도는 공개돼 있지 않다.
  # `tradebot latency` 가 응답 헤더(X-RateLimit-Limit)를 보여주면 그 값의 80% 로 맞출 것.
  rate_limits_per_second:
    MARKET_DATA: 8
    MARKET_DATA_CHART: 8
  # 쉬는 연결을 유지하는 시간(초). httpx 기본 5초는 분 마감마다 새 TLS 연결을 맺게 만든다.
  keepalive_seconds: 30
  max_connections: 20
  # HTTP/2: 연결 하나로 병렬 요청을 보낸다. `pip install "httpx[http2]"` 후 true 로 바꾸고
  # `tradebot latency` 의 "HTTP 버전" 과 "동시 조회" 수치로 효과를 확인할 것. (실서버 미검증)
  http2: false
  # 토큰 파일 캐시 (data/ 는 .gitignore 대상). 여러 프로세스가 같은 토큰을 공유한다.
  token_cache_path: data/.token.json

logging:
  level: INFO
  mask_secrets: true
