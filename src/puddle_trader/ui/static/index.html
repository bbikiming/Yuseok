// 저장해 둔 화면 테마를 그리기 전에 적용한다 (없으면 시스템 설정을 따른다)

<style>

--mute:#7E7E87;--blue:#3485FA;--blue-press:#4593FC;--blue-text:#64A8FF;--blue-tint:rgba(52,133,250,.16);
--up:#F04452;--up-text:#F66570;--up-tint:rgba(240,68,82,.16);--down:#3485FA;--down-text:#64A8FF;
--down-tint:rgba(52,133,250,.16);--inv-bg:#E4E4E5;--inv-fg:#17171C;--knob-shadow:0 1px 3px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#17171C;--surface:#202027;--fill:#2C2C35;
--fill-weak:#26262E;--line:#2C2C35;--line-strong:#4D4D59;--ink:#FFFFFF;--ink2:#E4E4E5;--btn-fg:#C3C3C6;--sub:#9E9EA4;
--mute:#7E7E87;--blue:#3485FA;--blue-press:#4593FC;--blue-text:#64A8FF;--blue-tint:rgba(52,133,250,.16);
--up:#F04452;--up-text:#F66570;--up-tint:rgba(240,68,82,.16);--down:#3485FA;--down-text:#64A8FF;

<body>
<header class="top"><div class="bar">
<a class="brand" href="#/"><b>웅덩이 트레이더</b></a>
<nav class="gnb" aria-label="메뉴" id="nav"></nav>
<div class="quick"><button type="button" class="btn small" id="sheetbtn" data-act="sheet-open" aria-haspopup="dialog" aria-controls="side"></button>
<button type="button" class="iconbtn" id="themebtn" data-act="theme"></button></div>
<div class="tools"><span id="mode" class="badge">연습 모드 · 실제 주문 없음</span><span id="topbtn"></span></div>
</div></header>
<div class="shell">
<div class="wrap">
<main id="view" aria-live="polite"><p class="sub">불러오는 중…</p></main>
</div>
<div class="backdrop" data-act="sheet-close"></div>
<aside class="side" id="side" aria-label="내 현황"><div id="sidehead"></div><div id="sidebody"></div></aside>
<div class="rail" id="rail" role="toolbar" aria-label="옆 패널 메뉴"></div>
</div>
<div id="toast" role="status"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const won = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("ko-KR") + "원";
const price = (n) => Math.round(n).toLocaleString("ko-KR");
const hm = (iso) => (iso || "").slice(11, 16);
const pct = (r) => (Math.abs(r) * 100).toFixed(1).replace(/\.0$/, "") + "%";
let status = null, timer = null;

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", body: JSON.stringify(body),
    headers: {"Content-Type": "application/json", "X-Tradebot": "1"}};
  const res = await fetch(path, opt);

async function viewSignals() {

<section class="card">${tradeList(list, "오늘은 아직 신호가 없어요. 조건이 맞을 때만 나오기 때문에 하루에 한 번도 없을 수 있어요.")}</section>`;

function chart(d) {
  const t = d.trade, bars = d.bars;
  if (!bars.length || !t) return "";
  // 좁은 화면에서는 그림을 줄이지 않고 좁게 다시 그린다 (글자가 작아지지 않게)
  const narrow = window.matchMedia("(max-width: 759px)").matches;
  const W = narrow ? 340 : 640, H = narrow ? 230 : 260, L = narrow ? 6 : 20, fs = narrow ? 13 : 14;
  const right = W - L - (d.last ? 46 : 0);
  const lo = Math.min(t.sl, ...bars.map((b) => b.l)), hi = Math.max(t.tp, ...bars.map((b) => b.h));
  const pad = (hi - lo) * 0.08, y = (v) => 24 + ((hi + pad - v) / (hi - lo + 2 * pad)) * (H - 48);
  const x = (i) => L + (i / Math.max(1, bars.length - 1)) * (right - L);
  const pts = bars.map((b, i) => `${x(i).toFixed(1)},${y(b.c).toFixed(1)}`).join(" ");
  const last = bars.length - 1, low = bars.reduce((a, b) => Math.min(a, b.l), Infinity);
  const line = (v, color) => `<line x1="${L}" y1="${y(v)}" x2="${W - L}" y2="${y(v)}" style="stroke:${color}" stroke-width="1.5" stroke-dasharray="5 5"></line>`;
  const nowDot = d.last ? `<circle cx="${W - L - 12}" cy="${y(d.last)}" r="7" style="fill:var(--ink);stroke:var(--surface)" stroke-width="3"></circle>
<text x="${W - L - 12}" y="${y(d.last) - 14}" text-anchor="middle" font-size="${fs}" font-weight="700" style="fill:var(--ink)">지금</text>` : "";
  return `<svg class="chart" role="img" viewBox="0 0 ${W} ${H}" aria-label="가격이 ${price(low)}원까지 내렸다가 반등해 ${price(t.entry_price)}원에 샀습니다. 목표가 ${price(t.tp)}원, 손절가 ${price(t.sl)}원.">
${line(t.tp, "var(--up)")}${line(t.entry_price, "var(--mute)")}${line(t.sl, "var(--down)")}
<polyline points="${pts}" fill="none" style="stroke:var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
<circle cx="${x(last)}" cy="${y(bars[last].c)}" r="6.5" style="fill:var(--surface);stroke:var(--ink)" stroke-width="3"></circle>
<text x="${L + 4}" y="${y(t.tp) - 8}" font-size="${fs}" font-weight="700" style="fill:var(--up-text)">목표가 ${price(t.tp)}</text>
<text x="${L + 4}" y="${y(t.entry_price) - 8}" font-size="${fs}" style="fill:var(--sub)">산 가격 ${price(t.entry_price)}</text>
<text x="${L + 4}" y="${y(t.sl) + 18}" font-size="${fs}" font-weight="700" style="fill:var(--down-text)">손절가 ${price(t.sl)}</text>
<text x="${x(last) - 14}" y="${y(bars[last].c) - 14}" text-anchor="end" font-size="${fs}" font-weight="700" style="fill:var(--ink);stroke:var(--surface)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">여기서 샀어요</text>
${nowDot}</svg>`;
}
async function viewSignal(id) {
  const d = await api("/api/signal?id=" + encodeURIComponent(id));
  rememberSignal(d);
  const t = d.trade, p = d.plan;
  if (!t) return `<h1>${esc(d.name)}</h1><p class="sub">매매 기록이 없어요.</p>`;
  const reasons = `<ol class="reasons">` + d.reasons.map((r, i) =>
    `<li><span class="n">${i + 1}</span><span><b>${esc(r.title)}</b> <span class="sub">${esc(r.detail)}</span></span></li>`).join("") + "</ol>";
  let head, result = "";
  if (t.open && !t.stale) {
    head = `<span class="chip fail">지켜보는 중 · ${hm(d.deadline)}까지</span>`;
  } else if (t.stale) {
    head = `<span class="chip">결과 확인 못 함</span>`;
    result = `<p class="note">프로그램이 중간에 꺼져서 이 매매가 어떻게 끝났는지 기록하지 못했어요.</p>`;
  } else {
    const a = t.amounts, cls = a.net >= 0 ? "up" : "down";
    head = resultChip(t);
    const why = t.result === "WIN" ? `가격이 목표가 ${price(t.tp)}원까지 올라서 약속대로 팔았어요.`
      : t.result === "LOSS" ? `가격이 손절가 ${price(t.sl)}원 아래로 내려가서 약속대로 팔았어요. 더 떨어지기 전에 손실을 작게 끊는 게 이 규칙의 목적입니다.`
      : `${d.max_hold_minutes}분 동안 목표가에도 손절가에도 닿지 않아서 그때 가격에 팔았어요.`;
    result = `<section class="card"><div><div class="sub">${esc(t.result_text)}</div>
<div class="num ${cls}" style="font-size:40px;font-weight:700;line-height:1.2">${signed(a.net)}</div></div><p>${why}</p>
<dl class="kv num"><div><dt>${hm(t.entry_time)} 산 가격</dt><dd>${price(t.entry_price)}원 × ${t.qty}주</dd></div>
<div><dt>${hm(t.exit_time)} 판 가격</dt><dd>${price(t.exit_price)}원 × ${t.qty}주</dd></div>
<div class="sum" style="font-weight:400"><dt style="color:var(--sub)">가격 차이</dt><dd>${signed(a.gross)}</dd></div>
<div><dt>수수료</dt><dd>${signed(a.commission)}</dd></div><div><dt>거래세</dt><dd>${signed(a.tax)}</dd></div>
<div class="sum"><dt>합계</dt><dd class="${cls}">${signed(a.net)}</dd></div></dl>
${t.result === "LOSS" && t.exit_price < t.sl ? `<p class="note small">손절가는 ${price(t.sl)}원인데 ${price(t.exit_price)}원에 판 걸로 계산했어요. 급하게 팔 때는 한 칸 낮은 가격에 팔리는 일이 많아서, 연습에서도 불리한 쪽으로 잡습니다.</p>` : ""}</section>`;
  }
  return `<div class="between" style="align-items:flex-end"><div><a href="#/signals"><b>← 신호 목록</b></a>
<h1 style="margin-top:6px">${esc(d.name)} · ${t.open ? "연습으로 샀어요" : "연습 매매 결과"}</h1>
<p class="sub num">${esc(d.detected_at.slice(0, 10))} ${hm(t.entry_time)} · 급하게 빠졌다가 다시 오르기 시작해서</p></div>${head}</div>
${result}
<div class="row"><section class="card w3"><h2>무슨 일이 있었나요</h2>${chart(d)}${reasons}</section>
<div class="w2" style="display:flex;flex-direction:column;gap:24px">
<section class="card"><h2>언제 파나요</h2><p class="small sub num">셋 중 먼저 일어나는 일에 따라 자동으로 팝니다. ${price(t.entry_price)}원 × ${t.qty}주(${won(t.entry_price * t.qty)}) 기준이에요.</p>
<div class="pill win num"><span><b>${price(t.tp)}원까지 오르면</b><br><span class="small sub">목표가</span></span><strong class="up">약 ${signed(p.win.net)}</strong></div>
<div class="pill loss num"><span><b>${price(t.sl)}원까지 내리면</b><br><span class="small sub">손절가 · 더 큰 손실을 막으려고 여기서 팔아요</span></span><strong class="down">약 ${signed(p.loss.net)}</strong></div>
<div class="pill flat num"><span><b>${d.max_hold_minutes}분 안에 둘 다 아니면</b><br><span class="small sub">오래 들고 있지 않아요</span></span><strong>그때 가격에</strong></div></section>
<section class="card"><h2>수수료와 세금</h2><p class="small sub">가격이 그대로여도 사고팔면 약 ${won(-p.flat.net)}이 나갑니다. 위 금액은 이걸 뺀 값이에요.</p></section></div></div>
<p class="note teal">연습이라서 실제 주문은 나가지 않았어요. 계좌의 돈은 그대로입니다.</p>`;
}

async function viewBacktest() {
  const b = await api("/api/backtest"), c = b.coverage, r = b.result, eco = b.economics;
  const busy = b.backfill.state === "running" || b.backtest.state === "running";
  clearTimeout(timer); if (busy) timer = setTimeout(render, 1500);
  let chip, title, text;
  if (!r) { chip = `<span class="chip">아직 안 해봤어요</span>`; title = "지난 기록에 규칙을 대 볼까요";
    text = "실제로 해 보기 전에, 이 규칙이 과거에 통했는지 먼저 확인합니다."; }
  else if (r.verdict === "hold") { chip = `<span class="chip">판정 보류</span>`; title = "아직 판단할 수 없어요";
    text = "이 규칙이 과거에 통했는지 보려면 지난 가격 기록이 더 필요해요. 기록이 적으면 운이 좋았던 며칠만 보고 착각하기 쉽습니다."; }
  else if (r.verdict === "pass") { chip = `<span class="chip pass">통과</span>`; title = "지난 기록에서는 통했어요";
    text = "수수료와 세금을 빼고도 평균적으로 남았습니다. 그래도 과거가 미래를 보장하지는 않아서, 다음은 연습 매매로 확인해요."; }
  else { chip = `<span class="chip fail">통과 못 함</span>`; title = "지난 기록에서는 통하지 않았어요";
    text = "평균적으로 잃었거나, 번 것이 운일 수 있어요. 이 상태로는 실제 돈으로 넘어가지 않습니다."; }
  const groups = r && r.groups ? Object.entries(r.groups).map(([k, g]) => {
    const per = g.expectancy == null ? "" : ` · 한 번에 평균 ${signed(g.expectancy * eco.order_amount)}`;

${g.passed ? "" : `<span class="small sub">${esc((g.reasons || []).join(" / "))}</span>`}</span>
<span class="chip ${g.passed ? "pass" : "fail"}">${g.passed ? "통과" : "통과 못 함"}</span></li>`;
  }).join("") : "";
  const kind = (k, label, extra) => `<div style="display:flex;flex-direction:column;gap:10px">
<div class="between"><b>${label}${extra}</b><span class="small sub num">이기면 약 ${signed(eco.kinds[k].win)} · 지면 약 ${signed(eco.kinds[k].loss)}</span></div>
${dots(eco.kinds[k].need_of_10)}<b>10번 중 ${eco.kinds[k].need_of_10}번은 이겨야 본전</b></div>`;
  const msg = [b.backfill, b.backtest].filter((t) => t.state !== "idle" && t.message)
    .map((t) => `<p class="note ${t.state === "error" ? "warn" : ""}" >${esc(t.message)}</p>`).join("");
  return `<section class="card">${chip}<h1 style="margin:0">${title}</h1><p class="sub" style="max-width:640px">${text}</p>

/* ---------- 그리기 ---------- */
async function render() {
  clearTimeout(timer);
  try { status = await api("/api/status"); } catch (e) { $("#view").innerHTML = `<p class="note warn">${esc(e.message)}</p>`; return; }
  drawNav(); drawTop(); drawSide();
  const [page, arg] = route();
  try {
    let html;
    if (page === "") html = viewHome();
    else if (page === "signals") html = await viewSignals();
    else if (page === "signal") html = await viewSignal(decodeURIComponent(arg || ""));
    else if (page === "favorites") html = await viewFavorites();
    else if (page === "backtest") html = await viewBacktest();
    else if (page === "history") html = await viewHistory();
    else if (page === "settings") html = await viewSettings();
    else html = `<h1>없는 화면이에요</h1><a href="#/">홈으로</a>`;
    if (route().join("/") !== [page, arg].filter((x) => x !== undefined).join("/")) return;
    $("#view").innerHTML = html;
  } catch (e) { $("#view").innerHTML = `<p class="note warn">${esc(e.message)}</p><a href="#/">홈으로</a>`; }
  if (page === "" || page === "signals" || page === "signal") timer = setTimeout(render, 2000);
}
async function act(fn, done) {
  try { await fn(); if (done) toast(done); } catch (e) { toast(e.message); }
  render();
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, m = b.dataset.m, c = b.dataset.c;
  if (a === "theme") toggleTheme();
  else if (a === "side") toggleSide(b.dataset.tab);
  else if (a === "notify-test") act(async () => { const r = await api("/api/notify/test", {}); toast(r.message); });
  else if (a === "notify-newtopic") { if (confirm("주제 이름을 새로 만들까요? 휴대폰 앱에서도 새 이름으로 다시 구독해야 해요.")) act(() => api("/api/notify/save", {channel: "ntfy", new_topic: true}), "새 주제 이름을 만들었어요"); }
  else if (a === "phone-revoke") { if (confirm("기억한 휴대폰을 모두 끊을까요? 다시 들어오려면 접속 코드를 넣어야 해요.")) act(() => api("/api/phone/revoke", {}), "모두 끊었어요"); }
  else if (a === "sheet-open") openSheet();
  else if (a === "sheet-close") closeSheet();
  else if (a === "watch-start") act(() => api("/api/watch/start", {}), "연습을 시작했어요");
  else if (a === "watch-stop") act(() => api("/api/watch/stop", {}), "지켜보기를 멈췄어요");
  else if (a === "fav-toggle") act(() => api("/api/favorites/toggle", {market: m, code: c, enabled: b.dataset.on === "1"}));
  else if (a === "fav-remove") { if (confirm("이 종목을 지울까요?")) act(() => api("/api/favorites/remove", {market: m, code: c}), "지웠어요"); }
  else if (a === "backfill") act(() => api("/api/backfill/run", {}), "과거 기록을 받기 시작했어요");
  else if (a === "backtest") act(() => api("/api/backtest/run", {}), "시험을 시작했어요");
  else if (a === "auth-check") act(async () => { const r = await api("/api/auth/check", {}); toast(r.message); });
});
document.addEventListener("submit", (ev) => {
  const form = ev.target.closest("[data-form]"); if (!form) return;
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(form).entries()), kind = form.dataset.form;
  if (kind === "fav-add") act(() => api("/api/favorites/add", d), "추가했어요");
  else if (kind === "notify") act(() => api("/api/notify/save", {channel: d.channel, telegram_token: d.telegram_token,
    on_entry: form.elements.on_entry.checked, on_exit: form.elements.on_exit.checked}), "저장했어요");
  else if (kind === "creds") act(async () => { const r = await api("/api/credentials", d); toast(r.message); });
  else if (kind === "settings") act(() => api("/api/settings", {
    order_amount: d.order_amount, max_hold_minutes: d.max_hold_minutes, max_daily_entries: d.max_daily_entries,
    take_profit_rate: d.tp / 100, stop_loss_rate: -Math.abs(d.sl) / 100,
    commission_rate: d.commission / 100, sell_tax_rate_stock: d.tax / 100}), "저장했어요");
});
// 위쪽 메뉴 줄이 두 줄로 접히면 옆 패널이 그 아래에서 시작하도록 높이를 알려 준다
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--hh", Math.round(e.target.getBoundingClientRect().height) + "px"))
  .observe($("header.top"));
window.addEventListener("hashchange", () => { closeSheet(false); render(); });
window.addEventListener("resize", () => drawSide());
document.addEventListener("keydown", (ev) => {
  if (!sheetOpen) return;
  if (ev.key === "Escape") { closeSheet(); return; }
  if (ev.key !== "Tab") return;                       // 시트가 열려 있는 동안 초점이 시트 밖으로 나가지 않게 한다
  const items = [...$("#side").querySelectorAll("button, a[href]")];
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
});
setInterval(pollSide, 2500);
render();
</script>
