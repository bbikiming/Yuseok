[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puddle-trader"
version = "0.1.0"
description = "CLI 기반 AI 학습형 웅덩이 단타 보조 시스템 (토스증권 Open API)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pandas>=2.2", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tradebot = "puddle_trader.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
